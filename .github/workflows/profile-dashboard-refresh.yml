name: Refresh Profile Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
  push:
    paths:
      - 'scripts/update-dashboard.mjs'
      - '.github/workflows/profile-dashboard-refresh.yml'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update dashboard assets and README tables
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: node scripts/update-dashboard.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/stats-card.svg assets/langs-card.svg
          git commit -m "chore: refresh profile dashboard data"
          git push
