<svg xmlns="http://www.w3.org/2000/svg" width="360" height="180" viewBox="0 0 360 180" role="img">
    <title>cj1071 public repository languages</title>
    <desc>Top languages by byte count across owned public repositories.</desc>
    
    <style>
      .frame { fill: transparent; stroke: #d0d7de; }
      .title { fill: #24292f; font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #57606a; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .value { fill: #24292f; font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .grid { stroke: #d8dee4; }
      .item { opacity: 0; animation: rise .55s ease-out forwards; }
      @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-color-scheme: dark) {
        .frame { stroke: #30363d; }
        .title, .value { fill: #f0f6fc; }
        .label { fill: #8b949e; }
        .grid { stroke: #30363d; }
      }
      @media (prefers-reduced-motion: reduce) { .item { opacity: 1; animation: none; } }
    </style>
    <rect x="1" y="1" width="358" height="178" rx="8" class="frame"/>
    <text x="22" y="32" class="title">Repository Languages</text>
    <g class="item" style="animation-delay:0ms"><text x="24" y="59" class="label">TypeScript</text><rect x="128" y="48" width="172" height="8" rx="4" fill="#d8dee4" opacity=".5"/><rect x="128" y="48" width="93.8" height="8" rx="4" fill="#3178c6"/><text x="332" y="59" text-anchor="end" class="label">54.5%</text></g><g class="item" style="animation-delay:120ms"><text x="24" y="83" class="label">JavaScript</text><rect x="128" y="72" width="172" height="8" rx="4" fill="#d8dee4" opacity=".5"/><rect x="128" y="72" width="55.6" height="8" rx="4" fill="#f1e05a"/><text x="332" y="83" text-anchor="end" class="label">32.3%</text></g><g class="item" style="animation-delay:240ms"><text x="24" y="107" class="label">CSS</text><rect x="128" y="96" width="172" height="8" rx="4" fill="#d8dee4" opacity=".5"/><rect x="128" y="96" width="21.0" height="8" rx="4" fill="#663399"/><text x="332" y="107" text-anchor="end" class="label">12.2%</text></g><g class="item" style="animation-delay:360ms"><text x="24" y="131" class="label">HTML</text><rect x="128" y="120" width="172" height="8" rx="4" fill="#d8dee4" opacity=".5"/><rect x="128" y="120" width="5.0" height="8" rx="4" fill="#e34c26"/><text x="332" y="131" text-anchor="end" class="label">0.9%</text></g>
  </svg>