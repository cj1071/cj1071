    <text x="42" y="152" fill="#9fc6ff" font-size="22">AI ENGINEERING · GAME MINDSET · CYBER XIANXIA</text>
    <text x="42" y="184" fill="#79ffd8" font-size="18">Quest: Build practical tools with stable architecture and fast delivery.</text>
  </g>

