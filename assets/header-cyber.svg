    <text x="840" y="140" fill="#b7ffea" font-family="monospace" font-size="16">Discipline: AI + Full-Stack</text>
    <text x="840" y="164" fill="#b7ffea" font-family="monospace" font-size="16">Status:     ONLINE</text>
