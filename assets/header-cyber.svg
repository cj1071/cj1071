    <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="none"/>
      <path d="M16 0H0V16" fill="none" stroke="#20315c" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#pixelGrid)"/>

  <g fill="#1fffe0" opacity="0.9">
